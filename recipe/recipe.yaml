schema_version: 1

context:
  name: openbabel
  version: "3.2.1"
  sha256: e140c25480fe1678d00b9a52462368fa4e7805fba67b12ee496784437f3e239e

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/openbabel/openbabel/archive/openbabel-${{ version|replace('.','-') }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - fix_library_path_search.diff
    - fix_data_path.diff
    - fix_babel_test_paths.diff
    - if: linux
      then: time.patch
    # openbabel 3.2.1's vendored InChI 1.07.5 references four AuxInfo API
    # functions from its Win32 DLL export shims but ships no implementation,
    # so inchi.dll fails to link on MSVC. Harmless elsewhere (the shim block is
    # #ifdef'd out), so only apply on Windows.
    - if: win
      then: fix_inchi_windows_link.diff

build:
  number: 2
  skip: win and vc<14

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: make
    - swig
  host:
    - python
    - setuptools
    - zlib
    - eigen
    - libxml2
    - cairo
    - rapidjson
  run:
    - python

tests:
  - python:
      imports:
        - openbabel.openbabel
        - openbabel.pybel
      pip_check: false
  - script:
      - obabel --help

about:
  license: GPL-2.0-only
  license_file: COPYING
  summary: A chemical toolbox designed to speak the many languages of chemical data
  description: |
    Open Babel is a chemical toolbox designed to speak the many languages of chemical
    data. It's an open, collaborative project allowing anyone to search, convert,
    analyze, or store data from molecular modeling, chemistry, solid-state materials,
    biochemistry, or related areas.
  homepage: http://openbabel.org/
  repository: https://github.com/openbabel/openbabel
  documentation: http://openbabel.org/

extra:
  recipe-maintainers:
    - jan-janssen
    - njzjz
    - mcs07
    - mwojcikowski
    - fredrikw
